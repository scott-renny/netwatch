# NET-WATCH site for the existing COC Caddy deployment.
# Add a Pi-hole local DNS record:
#   netwatch.coc-srv-01.home.arpa -> 192.168.1.30

netwatch.coc-srv-01.home.arpa {
    tls internal
    encode zstd gzip
    root * /opt/netwatch/web

    @api path /api/*
    handle @api {
        reverse_proxy 127.0.0.1:8082
    }

    handle {
        try_files {path} /index.html
        file_server
    }

    header {
        -Server
        X-Content-Type-Options "nosniff"
        X-Frame-Options "DENY"
        Referrer-Policy "no-referrer"
        Permissions-Policy "camera=(), microphone=(), geolocation=()"
    }
}

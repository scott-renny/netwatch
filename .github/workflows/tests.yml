name: Tests

on:
  push:
    branches:
      - main
      - agent/**
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install flask flask-cors requests
      - name: Compile backend
        run: python -m py_compile api/netwatch_api.py
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
